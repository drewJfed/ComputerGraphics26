<html>
    <head><title>Karl Was Here</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />    
</head>

<script type="module">

    import * as THREE from "./threejs/three.module.js";

    async function getContent(url) {
        try {
                const response = await fetch(url);
                if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            }
            const result = await response.text();
            return result;
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    let camera, scene, renderer;

    const vertexCode=await getContent("shadow.vertex.glsl");
    const fragmentCode=await getContent("shadow.fragment.glsl");

    let uniforms;

    function randomStuff(){
        let theLights=[];
        let theColors=[];
        let theSpheres=[];
        for (let i=0;i<10;i++){
            theLights.push(new THREE.Vector3(
                Math.random()*10.0-5.0,
                Math.random()*10.0-5.0,
                Math.random()*10.0-5.0,));
            theColors.push(new THREE.Vector3(
                Math.random(),
                Math.random(),
                Math.random(),));
            theSpheres.push(new THREE.Vector3(
                Math.random()*10.0-5.0,
                Math.random()*10.0-5.0,
                Math.random()*10.0-5.0,));
        }
        return {lights:theLights,colors:theColors,spheres:theSpheres};
    }

    function init() {
        let can=document.getElementById('area');
        camera = new THREE.PerspectiveCamera( 90, 300 / 300, 0.1, 100 );
        camera.position.z = 5;
        camera.position.y = 5;
        let stuff=randomStuff();

          uniforms={
            time:{value:0.0},
            lights:{value:stuff.lights},
            lightColors:{value:stuff.colors},
            spheres:{value:stuff.spheres}
          };
          let material = new THREE.ShaderMaterial( {
            side: THREE.DoubleSide,
            uniforms:uniforms, 
            vertexShader: vertexCode,
            fragmentShader: fragmentCode
          } ); 
        scene = new THREE.Scene();
          for (let i=0;i<10;i++){
            let geom=new THREE.SphereGeometry(0.5,16,8);
            let mesh = new THREE.Mesh( geom, material );
            mesh.position.set(
                stuff.spheres[i].x,
                stuff.spheres[i].y,
                stuff.spheres[i].z
            );
            scene.add(mesh);
          }
        const size = 10;
        const divisions = 10;
        const gridHelper = new THREE.GridHelper( size, divisions );
        scene.add( gridHelper );  

        renderer = new THREE.WebGLRenderer( { antialias: true,canvas:can }  );
        
        renderer.setAnimationLoop( animate );
     }


    let dt=0.01;
    function animate() {
        uniforms.time.value+=dt;
        renderer.render( scene, camera );
    }

    init();

    document.getElementById('upC').addEventListener('click',(evt)=>camera.position.y -= 0.5)
    document.getElementById('downC').addEventListener('click',(evt)=>camera.position.y += 0.5)
    document.getElementById('leftC').addEventListener('click',(evt)=>camera.position.x -= 0.5)
    document.getElementById('rightC').addEventListener('click',(evt)=>camera.position.x += 0.5)

    document.getElementById('up').addEventListener('click',(evt)=>camera.rotation.x -= 0.1)
    document.getElementById('down').addEventListener('click',(evt)=>camera.rotation.x += 0.1)
    document.getElementById('left').addEventListener('click',(evt)=>camera.rotation.y -= 0.1)
    document.getElementById('right').addEventListener('click',(evt)=>camera.rotation.y += 0.1)

    //document.getElementById('area').addEventListener('mousemove',mouseMoved);
</script>
<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Camera Position:
<button id="upC">^</button>
<button id="downC">v</button>
<button id="leftC">&lt;</button>
<button id="rightC">></button></p>
<p>Camera Angle:
<button id="up">^</button>
<button id="down">v</button>
<button id="left">&lt;</button>
<button id="right">></button>
</p>
<canvas id="area" width="600px" height="600px">
</canvas>
</body>
</html>
