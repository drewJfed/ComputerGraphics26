<html>
    <head><title>Karl Was Here</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />    
</head>

<script type="module">

    import * as THREE from "./threejs/three.module.js";

    async function getContent(url) {
        try {
                const response = await fetch(url);
                if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            }

            const result = await response.text();
            console.log(result);
            return result;
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    let camera, scene, renderer;
    let mesh;
    let bullets=[];
    let can;
    let bgeom,material;

    function fun(x,y){
        return Math.cos(x*6.28/20.0)*3*Math.sin(y*6.28/20.0);
    }
    function ourPlane() {
        const start=-5.0;
        const end=5.0;
        const step=.5;
        let vertices=[];
        let indices=[];
        let uvs=[];
        let count=0;
        for (let x=start;x<=end;x+=step){
            for (let y=start;y<=end;y+=step){
                let z0=fun(x,y);
                let z1=fun(x-step,y);
                let z2=fun(x,y-step);
                let z3=fun(x-step,y-step);
                let uv0=[0,0];
                let uv1=[1,0];
                let uv2=[0,1];
                let uv3=[1,1];
                let tri1=[x-step,y-step,z3,
                          x   ,y   ,z0,
                          x   ,y-step,z2
                ];
                uvs=uvs.concat(uv0,uv3,uv1);
                let tri2=[x-step,y-step,z3,
                          x   ,y   ,z0,
                          x-step,y   ,z1
                ];
                uvs=uvs.concat(uv0,uv3,uv2);                let tri1Indices=[count,count+2,count+1];
                let tri2Indices=[count+3,count+4,count+5];
                vertices=vertices.concat(tri1);
                vertices=vertices.concat(tri2);

                indices=indices.concat(tri1Indices);
                indices=indices.concat(tri2Indices);
                count+=6;
            }
        }
        //console.log(positions);
        //console.log(indices);
        let geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
                'position',
                new THREE.BufferAttribute(new Float32Array(vertices), 3));
        geometry.setAttribute(
                'uv',
                new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geometry.setIndex(indices);        
        geometry.computeVertexNormals();
        return geometry;
    }

    function ourTrivial(){
        let positions=[1,1,1, 
                         0,1,1, 
                         0,0,1];
        let indices=[0,1,2];
        let uvs=[0,0,
                 0,1,
                 1,0,
                ];
        let geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
                'position',
                new THREE.BufferAttribute(new Float32Array(positions), 3));
        geometry.setAttribute(
                'uv',
                new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geometry.setIndex(indices);        
        geometry.computeVertexNormals();
        return geometry;
    }

    const vertexCode=await getContent("cable.vertex.glsl");
    console.log(vertexCode);
    const fragmentCode=await getContent("cable.fragment.glsl");
    console.log(fragmentCode);

    let uniforms1;
    function init() {
        let can=document.getElementById('area');
        camera = new THREE.PerspectiveCamera( 90, 300 / 300, 0.1, 100 );
        camera.position.z = 5;
        camera.position.y = 5;

        //const geometry=ourTrivial();
        //const geometry = new THREE.BoxGeometry();
        //const geometry = new THREE.TorusKnotGeometry();
        bgeom=new THREE.SphereGeometry();
        const geometry=ourPlane();
        //const material = new THREE.MeshBasicMaterial({color: 0x7f7f7f}); 
        uniforms1={
            time:{value:0.0},
            defaultColor: {value:new THREE.Vector3(0.0,0.0,1.0)}
        } ;
        material = new THREE.ShaderMaterial( {
          side: THREE.DoubleSide,
          uniforms:uniforms1, 
          vertexShader: vertexCode,
          fragmentShader: fragmentCode
        } );        
        mesh = new THREE.Mesh( geometry, material );
        //bullet=new THREE.Mesh(bgeom,material);

        scene = new THREE.Scene();
        scene.add( mesh );

        renderer = new THREE.WebGLRenderer( { antialias: true,canvas:can }  );
        
        renderer.setAnimationLoop( animate );
        mesh.rotation.x=2.0;
        mesh.rotation.z=1.57;   
     }

    function updateBullets() {
        bullets.forEach((b)=>{
          b.position.z-=0.05;
          if (b.position.z<-10.0) {
            const index = bullets.indexOf(b);
            if (index !== -1)
                bullets.splice(index, 1);
               scene.remove(b);
               //b.mesh.dispose();
               //b.material.dispose();
          }
        });
    }
    function fire(){
        let bullet=new THREE.Mesh(bgeom,material);
        bullet.position.copy(camera.position);
        scene.add(bullet);
        bullets.push(bullet);
    }

    function animate() {
        updateBullets();
        uniforms1.time.value+=0.01;
        renderer.render( scene, camera );
    }

    init();
    document.getElementById('up').addEventListener('click',(evt)=>mesh.rotation.x += 0.1)
    document.getElementById('down').addEventListener('click',(evt)=>mesh.rotation.x -= 0.1)
    document.getElementById('left').addEventListener('click',(evt)=>mesh.rotation.z -= 0.1)
    document.getElementById('right').addEventListener('click',(evt)=>mesh.rotation.z += 0.1)

    document.getElementById('upC').addEventListener('click',(evt)=>camera.position.y -= 0.5)
    document.getElementById('downC').addEventListener('click',(evt)=>camera.position.y += 0.5)
    document.getElementById('leftC').addEventListener('click',(evt)=>camera.position.x -= 0.5)
    document.getElementById('rightC').addEventListener('click',(evt)=>camera.position.x += 0.5)


    document.getElementById('fire').addEventListener('click',fire)

</script>
<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Surface Rotation:
<button id="up">^</button>
<button id="down">v</button>
<button id="left">&lt;</button>
<button id="right">></button></p>
<p>Camera Position:
<button id="upC">^</button>
<button id="downC">v</button>
<button id="leftC">&lt;</button>
<button id="rightC">></button></p>
<p><button id='fire'>Fire</button></p>
<canvas id="area" width="600px" height="600px">
</canvas>
</body>
</html>
