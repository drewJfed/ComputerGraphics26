<html>
    <head><title>Federspiel Project</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    </head>


<script type="module">
    import * as THREE from "./threejs/three.module.js";
    import { STLLoader } from "./threejs/jsm/STLLoader.js";


    async function getContent(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Response status: ${response.status}`);
            return await response.text();
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    let camera, scene, renderer;
    let car = [];
    let numberOfCars = 20;

    let camTime = 0;
    let lightTime = 0;
    let dt = 0.03;
    let camdt = 0.01;
    let lights = [];
    let scale = 1.0;

    const canvas = document.getElementById('texture');
    let texture = new THREE.CanvasTexture(canvas);

    const ctx = canvas.getContext("2d");
    let grd = ctx.createLinearGradient(0, 0, 255, 0);
    grd.addColorStop(0, "blue");
    grd.addColorStop(1, "white");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 255, 255);

    async function init() {
        const loader = new STLLoader();
        const geom = await new Promise((resolve, reject) => {
            loader.load(
                './low_poly_e30_rally.stl',
                (geometry) => resolve(geometry),
                undefined,
                (error) => reject(error)
            );
        });

        

        let can = document.getElementById('area');
        camera = new THREE.PerspectiveCamera(90, 1, 0.1, 1000);
        camera.position.set(0, 5, 15);

        scene = new THREE.Scene();

        // Use a MeshNormalMaterial or MeshStandardMaterial temporarily 
        // to guarantee it shows up regardless of texture UV mapping!
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            roughness: 0.2,
            metalness: 0.6,
            side: THREE.DoubleSide 
        });

        // ----------------LIGHT
        //const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        //scene.add(ambientLight);
        let directionalLight = new THREE.DirectionalLight(0xffffff, 4); // (color, intensity)
        directionalLight.position.set(0, 5*scale, 0);
        scene.add(directionalLight);
        lights.push(directionalLight);
        // ----------------------------------


        // ---CAR-------------------
        for(let i = 0; i < numberOfCars ; i++){ 
            let carMesh = new THREE.Mesh(geom, material);
            
            carMesh.scale.set(scale / 200, scale / 200, scale / 200); // make smaller

            scene.add(carMesh);
            car.push(carMesh);
        }

        let numCars = 0;
        for (const c of car) {
            numCars++;
            // set car orientation
            c.rotation.x = Math.PI / 2;
            c.rotation.y = Math.PI;
            c.position.y = 0.7 * scale;

            c.position.z = 7 * scale * (numCars - 1);
        }
        // ---------------------------

        const size = 15;
        const divisions = 20;
        const gridHelper = new THREE.GridHelper(size, divisions);
        scene.add(gridHelper);

        renderer = new THREE.WebGLRenderer({ antialias: true, canvas: can });
        renderer.setAnimationLoop(animate);

        
        // Listen for left and right arrow keys to change cam speed
        document.body.addEventListener('keydown',(ev)=>{
            ev.preventDefault();
            if(ev.key=="ArrowLeft") {
                camdt += 0.005
            }
        } )
        document.body.addEventListener('keydown',(ev)=>{
            ev.preventDefault();
            if(ev.key=="ArrowRight") {
                camdt -= 0.005
            }
        } )

        // Listen for up and down arrow keys to move camera up and down
        document.body.addEventListener('keydown',(ev)=>{
            ev.preventDefault();
            if(ev.key=="ArrowUp") {
                camera.position.y += 1
            }
        } )
        document.body.addEventListener('keydown',(ev)=>{
            ev.preventDefault();
            if(ev.key=="ArrowDown") {
                camera.position.y -= 1
            }
        } )
    }

    function updatelights(dt) {
        lightTime += dt;
        for (const v of lights){
            v.position.x = -5 * Math.cos(lightTime);
            v.position.z = 5 * Math.sin(lightTime);
        }
    }

    function spinCamera(cdt) {
        camTime += cdt;
        camera.position.x = 12 * Math.cos(camTime);
        camera.position.z = 12 * Math.sin(camTime);
        // point camera at center of road
        camera.lookAt(0, scale, 0);
    }

    function animate() {
        updatelights(dt);
        spinCamera(camdt);
        renderer.render(scene, camera);
    }

    init();
</script>

<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Adjust Camera Height with ^ and v Arrows
</p>
<p>Adjust Camera Rotation Speed with < and > Arrows
</p>
<canvas id="area" width="600px" height="600px">
</canvas>
<canvas id="texture" width="256px" height="256px" style="display:none">
</canvas>
</body>
</html>
