<html>
    <head><title>Federspiel Project</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    </head>


<script type="module">
    import * as THREE from "./threejs/three.module.js";
    import { OBJLoader } from "./threejs/jsm/OBJLoader.js";
    import { MTLLoader } from "./threejs/jsm/MTLLoader.js";
    import { OrbitControls } from "./threejs/jsm/OrbitControls.js";

    async function getContent(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Response status: ${response.status}`);
            return await response.text();
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    const lightCode=await getContent("./lighting.glsl");
    const lightPos = await getContent("./lightPositions.glsl");


    let camera, scene, renderer;
    let car = [];
    let lightBulb;
    let numberOfCars = 3;

    let camTime = 0;
    let lightTime = 0;
    let dt = 0.03;
    let initCamSpeed = 0.003;
    let camdt = initCamSpeed;
    let lights = [];
    let scale = 1.3;

    //let uniformsBody, uniformsWind, uniformsHead, uniformsBrake, uniformsWheels;

    let controls;

    const sharedLightUniforms = {
        time: { value: 0.0 },
        lightLoc1: { value: new THREE.Vector3(5.0, 5.0, 5.0) },
        LightColor1: { value: new THREE.Vector3(1.0, 0.2, 1.0) }
    };

    async function init() {

        // Create materials by combining individual color properties with shared light uniforms
        const materials = {
            'carBody': new THREE.ShaderMaterial({
                side: THREE.DoubleSide,
                uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(1.0, 1.0, 1.0) } }, sharedLightUniforms),
                transparent: true,
                vertexShader: lightPos,
                fragmentShader: lightCode
            }),
            'wind': new THREE.ShaderMaterial({
                side: THREE.DoubleSide,
                uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(0.3, 0.6, 1.0) } }, sharedLightUniforms),
                transparent: true,
                vertexShader: lightPos,
                fragmentShader: lightCode
            }),
            'headlights': new THREE.ShaderMaterial({
                side: THREE.DoubleSide,
                uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(0.3, 0.6, 1.0) } }, sharedLightUniforms),
                transparent: true,
                vertexShader: lightPos,
                fragmentShader: lightCode
            }),
            'brakeLights': new THREE.ShaderMaterial({
                side: THREE.DoubleSide,
                uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(0.3, 0.6, 1.0) } }, sharedLightUniforms),
                transparent: true,
                vertexShader: lightPos,
                fragmentShader: lightCode
            }),
            'wheels': new THREE.ShaderMaterial({
                side: THREE.DoubleSide,
                uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(0.2, 0.2, 0.2) } }, sharedLightUniforms),
                transparent: true,
                vertexShader: lightPos,
                fragmentShader: lightCode
            })
        };

        scene = new THREE.Scene();

        const loadedCar = await new Promise((resolve, reject) => {
            const objLoader = new OBJLoader();
            objLoader.load('./CarTexture.obj', (object) => {
                object.traverse((child) => {
                    if (child.isMesh) {
                        console.log("Groups found in geometry:", child.geometry.groups);

                        // Map your shaders into an array corresponding to materialIndex 0 -> 4 
                        // (Make sure the order matches how they appear in your .obj file)
                        child.material = [
                            materials['carBody'],       // maps to materialIndex: 0
                            materials['wind'],          // maps to materialIndex: 1
                            materials['headlights'],    // maps to materialIndex: 2
                            materials['brakeLights'],   // maps to materialIndex: 3
                            materials['wheels']         // maps to materialIndex: 4
                        ];
                    }
                });
                resolve(object);
            }, undefined, (error) => reject(error));
        });

        let can = document.getElementById('area');
        camera = new THREE.PerspectiveCamera(90, 1, 0.1, 1000);
        camera.position.set(0, 5, 15);

        // ---CAR-------------------
        for(let i = 0; i < numberOfCars; i++){ 
            let carGroup = loadedCar.clone();
            carGroup.scale.set(scale / 20, scale / 20, scale / 20); 
            carGroup.rotation.y = Math.PI;
            carGroup.position.y = 0.7 * scale;
            carGroup.position.z = 7 * scale * i;
            
            scene.add(carGroup);
            car.push(carGroup);
        }
        // ---------------------------

        // Lightbulb
        const bulb = new THREE.SphereGeometry();
        // const bulbUniform = {
        //     time:{value:0.0},
        //     defaultColor: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
        //     lightLoc1: { value: new THREE.Vector3(5.0, 5.0, 5.0) },
        //     LightColor1: { value: new THREE.Vector3(1.0, 1.0, 1.0) }
        // };
        const bulbMaterial = new THREE.ShaderMaterial( {
            side: THREE.DoubleSide,
            uniforms: Object.assign({ defaultColor: { value: new THREE.Vector3(1.0, 1.0, 1.0) } }, sharedLightUniforms),
            transparent: true,
            vertexShader: lightPos,
            fragmentShader: lightCode
        });
        lightBulb = new THREE.Mesh(bulb, bulbMaterial);
        scene.add(lightBulb);
        lightBulb.scale.set(0.25, 0.25, 0.25);

        // Grid
        const gridSize = 15;
        const gridDivisions = 20;
        const gridHelper = new THREE.GridHelper(gridSize, gridDivisions);
        scene.add(gridHelper);

        renderer = new THREE.WebGLRenderer({ antialias: true, canvas: can });
        renderer.setAnimationLoop(animate);

        controls = new OrbitControls( camera, renderer.domElement );


        // Listen for left and right arrow keys to change cam speed
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowLeft") {
                camdt += initCamSpeed;
            }
        });
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowRight") {
                camdt -= initCamSpeed;
            }
        });

        // Listen for up and down arrow keys to move camera up and down
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowUp") {
                camera.position.y += 1;
            }
        });
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowDown") {
                camera.position.y -= 1;
            }
        });
    }

    function updatelights(dt) {
        lightTime += dt;
        let lpos = lightTime % 50 - 25;
        // Orbit the light position in a circle around the center
        sharedLightUniforms.lightLoc1.value.x = 5.0;
        sharedLightUniforms.lightLoc1.value.z = 10 * lpos;
        sharedLightUniforms.lightLoc1.value.y = 7.0; 

        lightBulb.position.x = 4.0;
        lightBulb.position.z = 10 * lpos;
        lightBulb.position.y = 7.0;
    }

    function spinCamera(cdt) {
        camTime += cdt;
        camera.position.x = 12 * Math.cos(camTime);
        camera.position.z = 12 * Math.sin(camTime);
        // point camera at center of road
        camera.lookAt(0, scale, 0);
    }

    let totalTime = 0;

    function animate() {
        updatelights(dt);
        spinCamera(camdt);

        controls.update();   // doesn't work while spinCamera() runs

        //totalTime += dt;
        // if (uniforms1) {
        //     uniforms1.time.value = totalTime;
        // }

        renderer.render(scene, camera);
    }

    init();
</script>

<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Adjust Camera Height with ^ and v Arrows
</p>
<p>Adjust Camera Rotation Speed with < and > Arrows
</p>
<canvas id="area" width="600px" height="600px">
</canvas>
<canvas id="texture" width="256px" height="256px" style="display:none">
</canvas>
</body>
</html>
