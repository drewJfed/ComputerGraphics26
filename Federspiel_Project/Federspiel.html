<html>
    <head><title>Federspiel Project</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    </head>


<script type="module">
    import * as THREE from "./threejs/three.module.js";
    import { OBJLoader } from "./threejs/jsm/OBJLoader.js";
    import { MTLLoader } from "./threejs/jsm/MTLLoader.js";
    import { OrbitControls } from "./threejs/jsm/OrbitControls.js";

    async function getContent(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Response status: ${response.status}`);
            return await response.text();
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    const lightCode=await getContent("./lighting.glsl");
    const lightPos = await getContent("./lightPositions.glsl");


    let camera, scene, renderer;
    let car = [];
    let numberOfCars = 3;

    let camTime = 0;
    let lightTime = 0;
    let dt = 0.03;
    let camdt = 0.01;
    let lights = [];
    let scale = 1.6;

    let uniforms1;

    let controls;

    async function init() {

        const mtlLoader = new MTLLoader();
        const materials = await new Promise((resolve, reject) => {
            mtlLoader.load(
                './CarTexture.mtl', // Make sure your .mtl file name matches
                (materials) => {
                    materials.preload();
                    resolve(materials);
                },
                undefined,
                (error) => reject(error)
            );
        });

        const loader = new OBJLoader();
        loader.setMaterials(materials);

        const loadedCar = await new Promise((resolve, reject) => {
            loader.load(
                './CarTexture.obj',
                (object) => resolve(object),
                undefined,
                (error) => reject(error)
            );
        });

        let can = document.getElementById('area');
        camera = new THREE.PerspectiveCamera(90, 1, 0.1, 1000);
        camera.position.set(0, 5, 15);

        scene = new THREE.Scene();

        // let directionalLight = new THREE.DirectionalLight(0xffffff, 5); // (color, intensity)
        // directionalLight.position.set(5, 10, 5);
        // scene.add(directionalLight);

        // uniforms1 = {
        //     time: { value: 0.0 },
        //     defaultColor: { value: new THREE.Vector3(0.3, 0.6, 1.0) },
        //     lightLoc1: { value: new THREE.Vector3(0.0, 5.0, 5.0) },
        //     LightColor1: { value: new THREE.Vector3(0.0, 0.25, 1.0) }        
        // };

        // const material = new THREE.ShaderMaterial({
        //     side: THREE.DoubleSide,
        //     uniforms: uniforms1, 
        //     transparent: true,
        //     vertexShader: lightPos,
        //     fragmentShader: lightCode
        // });

        // const material = new THREE.MeshStandardMaterial({
        //     color: 0x888888,
        //     roughness: 0.1,
        //     metalness: 0.7,
        //     side: THREE.DoubleSide
        // });

        // ----------------LIGHT
        let directionalLight = new THREE.DirectionalLight(0xffffff, 10); // (color, intensity)
        directionalLight.position.set(5*scale, 5*scale, 0);
        scene.add(directionalLight);
        lights.push(directionalLight);
        // ----------------------------------

        // ---CAR-------------------
        for(let i = 0; i < numberOfCars; i++){ 
            let carGroup = loadedCar.clone();
            
            carGroup.scale.set(scale / 20, scale / 20, scale / 20); // make smaller

            scene.add(carGroup);
            car.push(carGroup);
        }

        let numCars = 0;
        for (const c of car) {
            numCars++;
            // set car orientation 
            c.rotation.y = Math.PI;
            c.position.y = 0.7 * scale;
            c.position.z = 7 * scale * (numCars - 1);
        }
        // ---------------------------

        const gridSize = 15;
        const gridDivisions = 20;
        const gridHelper = new THREE.GridHelper(gridSize, gridDivisions);
        scene.add(gridHelper);

        renderer = new THREE.WebGLRenderer({ antialias: true, canvas: can });
        renderer.setAnimationLoop(animate);

        controls = new OrbitControls( camera, renderer.domElement );


        // Listen for left and right arrow keys to change cam speed
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowLeft") {
                camdt += 0.005;
            }
        });
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowRight") {
                camdt -= 0.005;
            }
        });

        // Listen for up and down arrow keys to move camera up and down
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowUp") {
                camera.position.y += 1;
            }
        });
        document.body.addEventListener('keydown', (ev) => {
            ev.preventDefault();
            if (ev.key == "ArrowDown") {
                camera.position.y -= 1;
            }
        });
    }

    // function updatelights(dt) {
    //     lightTime += dt;
    //     for (const v of lights){
    //         v.position.x = -5 * Math.cos(lightTime);
    //         v.position.z = 5 * Math.sin(lightTime);
    //     }
    // }

    function spinCamera(cdt) {
        camTime += cdt;
        camera.position.x = 12 * Math.cos(camTime);
        camera.position.z = 12 * Math.sin(camTime);
        // point camera at center of road
        camera.lookAt(0, scale, 0);
    }

    let totalTime = 0;

    function animate() {
        //updatelights(dt);
        spinCamera(camdt);

        controls.update();   // doesn't work while spinCamera() runs

        totalTime += dt;
        if (uniforms1) {
            uniforms1.time.value = totalTime;
        }

        renderer.render(scene, camera);
    }

    init();
</script>

<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Adjust Camera Height with ^ and v Arrows
</p>
<p>Adjust Camera Rotation Speed with < and > Arrows
</p>
<canvas id="area" width="600px" height="600px">
</canvas>
<canvas id="texture" width="256px" height="256px" style="display:none">
</canvas>
</body>
</html>
