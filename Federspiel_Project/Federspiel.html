<html>
    <head><title>Federspiel Project</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    </head>


<script type="module">
    import * as THREE from "./threejs/three.module.js";
    import { STLLoader } from "./threejs/jsm/STLLoader.js";


    async function getContent(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Response status: ${response.status}`);
            return await response.text();
        } catch (error) {
            console.error(error.message);
            return "";
        }
    }

    let camera, scene, renderer;
    let car = [];
    let camTime = 0;
    let dt = 0.03;
    let camdt = 0.01;

    const canvas = document.getElementById('texture');
    let texture = new THREE.CanvasTexture(canvas);

    const ctx = canvas.getContext("2d");
    let grd = ctx.createLinearGradient(0, 0, 255, 0);
    grd.addColorStop(0, "blue");
    grd.addColorStop(1, "white");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 255, 255);

    async function init() {
        const loader = new STLLoader();
        const geom = await new Promise((resolve, reject) => {
            loader.load(
                './low_poly_e30_rally.stl',
                (geometry) => resolve(geometry),
                undefined,
                (error) => reject(error)
            );
        });

        // --- DEBUGGING: Check STL size and center ---
        geom.computeBoundingBox();
        const box = geom.boundingBox;
        //console.log("Model Bounding Box:", box);
        
        // Center geometry to its own origin if it's way off-center
        geom.center();

        let can = document.getElementById('area');
        camera = new THREE.PerspectiveCamera(90, 1, 0.1, 1000);
        camera.position.set(0, 5, 15);

        scene = new THREE.Scene();

        // Use a MeshNormalMaterial or MeshStandardMaterial temporarily 
        // to guarantee it shows up regardless of texture UV mapping!
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ff00, 
            roughness: 0.4,
            metalness: 0.6,
            side: THREE.DoubleSide 
        });

        // Add a light so MeshStandardMaterial can be seen
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        let carMesh = new THREE.Mesh(geom, material);

        carMesh.scale.set(0.005, 0.005, 0.005); // make smaller

        scene.add(carMesh);
        car.push(carMesh);

        const size = 15;
        const divisions = 20;
        const gridHelper = new THREE.GridHelper(size, divisions);
        scene.add(gridHelper);

        renderer = new THREE.WebGLRenderer({ antialias: true, canvas: can });
        renderer.setAnimationLoop(animate);

        // UI Event Listeners
        document.getElementById('downC').addEventListener('click', () => camera.position.y -= 1);
        document.getElementById('upC').addEventListener('click', () => camera.position.y += 1);
        document.getElementById('up').addEventListener('click', () => camdt += 0.005);
        document.getElementById('down').addEventListener('click', () => camdt -= 0.005);
    }

    function updateCar(dt) {
        for (let i = 0; i < car.length; i++) {
            car[i].rotation.y += dt;
        }
    }

    function spinCamera(cdt) {
        camTime += cdt;
        camera.position.x = 15 * Math.cos(camTime);
        camera.position.z = 15 * Math.sin(camTime);
        camera.lookAt(0, 0, 0);
    }

    function animate() {
        updateCar(dt);
        spinCamera(camdt);
        renderer.render(scene, camera);
    }

    init();
</script>

<style>
    p {color:blue;}
    canvas {background-color: pink;}
</style>
<body>
<p>Camera Height:
<button id="upC">^</button>
<button id="downC">v</button>
</p>
<p>Camera Speed:
<button id="up">^</button>
<button id="down">v</button>
</p>
<canvas id="area" width="600px" height="600px">
</canvas>
<canvas id="texture" width="256px" height="256px" style="display:none">
</canvas>
</body>
</html>
